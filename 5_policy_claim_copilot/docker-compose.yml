services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: copilot_qdrant
    ports:
      - "6333:6333" # REST API & Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: copilot_redis
    ports:
      - "6381:6379" # Host port 6381 avoids conflict with existing redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: copilot_mongodb
    ports:
      - "27018:27017" # Host port 27018 avoids conflict with existing mongo
    environment:
      - MONGO_INITDB_DATABASE=claim_copilot
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  mongo_data:
